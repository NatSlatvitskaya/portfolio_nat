<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наташа — Портфолио</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Статичные фоны с разными режимами наложения -->
    <div class="bg-pattern pattern-1"></div>
    <div class="bg-pattern pattern-2"></div>

    <!-- Интерактивное свечение за курсором -->
    <div class="cursor-glow" id="cursor-glow"></div>

    <div class="portfolio-container">
        <!-- Шапка (Header) -->
        <header class="hero-header">
            <div class="header-container">
                <div class="header-left">
                    <a href="projects.html" class="nav-btn">Все проекты</a>
                </div>
                <div class="header-center">
                    <h1 class="greeting-text">
                        Привет, Я — Наташа<br>
                        <span class="greeting-tag">{графический и бренд-дизайнер}</span>
                    </h1>
                </div>
                <div class="header-right">
                    <a href="about.html" class="nav-btn experience-text">6 лет опыта</a>
                </div>
            </div>
        </header>

        <!-- Центральный персонаж (Кот) -->
        <div class="avatar-wrapper">
            <img src="images/avatar.png" alt="Персонаж Кот" class="avatar-img">
        </div>

        <!-- Контейнер с 8 плашками проектов -->
        <div class="cards-container">
            <div class="project-card card-smart">
                <div class="card-inner">
                    <div class="card-preview"></div>
                    <div class="card-label">SMART</div>
                </div>
            </div>

            <div class="project-card card-memoria">
                <div class="card-inner">
                    <div class="card-preview"></div>
                    <div class="card-label">MEMORIA</div>
                </div>
            </div>

            <div class="project-card card-lidia">
                <div class="card-inner">
                    <div class="card-preview"></div>
                    <div class="card-label">LIDIA&POGGIO</div>
                </div>
            </div>

            <div class="project-card card-agly">
                <div class="card-inner">
                    <div class="card-preview"></div>
                    <div class="card-label">AGLY</div>
                </div>
            </div>

            <div class="project-card card-slet">
                <div class="card-inner">
                    <div class="card-preview"></div>
                    <div class="card-label">SLET</div>
                </div>
            </div>

            <div class="project-card card-smarty">
                <div class="card-inner">
                    <div class="card-preview"></div>
                    <div class="card-label">SMARTY</div>
                </div>
            </div>

            <div class="project-card card-project-br">
                <div class="card-inner">
                    <div class="card-preview"></div>
                    <div class="card-label">ПРОЕКТ</div>
                </div>
            </div>

            <div class="project-card card-project-tr">
                <div class="card-inner">
                    <div class="card-preview"></div>
                    <div class="card-label">ПРОЕКТ</div>
                </div>
            </div>
        </div>

        <!-- Подвал с тегами и капсулой (616x148px из Figma) -->
        <footer class="hero-footer">
            <div class="footer-left">
                <span class="tag-text">{брендинг}</span>
                <span class="tag-text">{веб-дизайн}</span>
            </div>
            
            <div class="footer-center">
                <div class="social-capsule">
                    <a href="#" class="capsule-btn" target="_blank" aria-label="CV">
                        <img src="images/cv.svg" alt="CV" class="capsule-icon">
                    </a>
                    <a href="https://dprofile.ru/nat_slatvitskaya" class="capsule-btn" target="_blank" aria-label="Dprofile">
                        <img src="images/dprofile.svg" alt="Dprofile" class="capsule-icon">
                    </a>
                    <a href="https://www.behance.net/nnzuzu5f5d" class="capsule-btn" target="_blank" aria-label="Behance">
                        <img src="images/behance.svg" alt="Behance" class="capsule-icon">
                    </a>
                    
                    <!-- Черная вертикальная черта -->
                    <span class="capsule-divider"></span>
                    
                    <a href="https://t.me/NatSlatvitskaya" class="capsule-btn" target="_blank" aria-label="Telegram">
                        <img src="images/telegram.svg" alt="Telegram" class="capsule-icon">
                    </a>
                    <a href="mailto:n.slatvickaya@gmail.com" class="capsule-btn" aria-label="Email">
                        <img src="images/email.svg" alt="Email" class="capsule-icon">
                    </a>
                </div>
            </div>
            
            <div class="footer-right">
                <span class="tag-text">{коммуникация}</span>
                <span class="tag-text">{иллюстрация}</span>
            </div>
        </footer>
    </div>

    <!-- Интерактивные скрипты -->
    <script>
        const glow = document.getElementById('cursor-glow');
        if (glow) {
            document.addEventListener('mousemove', (e) => {
                glow.style.transform = `translate3d(${e.clientX - 300}px, ${e.clientY - 300}px, 0)`;
            });
        }

        document.addEventListener('click', (e) => {
            if (
                e.target.closest('a') || 
                e.target.closest('.project-card') || 
                e.target.closest('.social-capsule') ||
                e.target.closest('button')
            ) {
                return;
            }
            document.body.classList.toggle('alt-theme');
        });
    </script>
</body>
</html>
